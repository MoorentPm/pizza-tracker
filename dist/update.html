<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b9f475"><title>Pizza Tracker</title>
<style>body{margin:0;background:#edf1f3;color:#293222;font:16px/1.5 Arial,sans-serif;min-height:100dvh;display:grid;place-items:center}a{color:inherit}</style>
</head><body><p role="status">Apertura del registro…</p><noscript><a href="./">Apri Pizza Tracker</a></noscript>
<script>
'use strict';
(async()=>{
  // Keep previously saved shortcuts working, without an update screen or button.
  const openApp=()=>location.replace('./?updated=1');
  const timeout=setTimeout(openApp,10000);
  try{
    if(!('serviceWorker' in navigator)||!navigator.onLine)return;
    const registration=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});
    await registration.update();
    await new Promise((resolve,reject)=>{
      const worker=registration.installing||registration.waiting||registration.active;
      if(!worker){resolve();return;}
      const changed=()=>{
        if(worker.state==='redundant'){worker.removeEventListener('statechange',changed);reject(Error('Download incomplete'));}
        else if(worker.state==='installed')worker.postMessage({type:'ACTIVATE_UPDATE'});
        else if(worker.state==='activated'){worker.removeEventListener('statechange',changed);resolve();}
      };
      worker.addEventListener('statechange',changed);changed();
    });
  }catch{/* The installed version remains usable when a download fails. */}
  finally{clearTimeout(timeout);openApp();}
})();
</script></body></html>
